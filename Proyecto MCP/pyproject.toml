[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-suite"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "scapy>=2.6.0",
  "mcp>=1.2.0",
  "fastmcp>=2.0.0",
  "httpx>=0.27.0",
  "openai>=1.40.0",
  "python-dotenv>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["servers*"]    # asegura que empaquete 'servers.porthunter' y subpaquetes

[project.scripts]
porthunter-mcp = "servers.porthunter.server:__main__"
trivia-http = "servers.remote.trivia_http.app:main"
mcp-host = "apps.host.app.main:main"
